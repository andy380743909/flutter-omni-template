name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Android: build AAB and publish to the Play internal track via Fastlane.
  # ---------------------------------------------------------------------------
  android-release:
    name: Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle install
      - run: flutter pub get
      - name: Fastlane Android release
        env:
          SUPPLY_JSON_KEY: ${{ secrets.SUPPLY_JSON_KEY }}
        run: bundle exec fastlane android release
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

  # ---------------------------------------------------------------------------
  # iOS: match + gym + deliver (needs a macOS runner for code signing).
  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: bundle install
      - run: flutter pub get
      - name: Fastlane iOS release
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane ios release
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "*.ipa"

  # ---------------------------------------------------------------------------
  # Desktop: native builds per OS, artifacts uploaded for manual distribution.
  # ---------------------------------------------------------------------------
  desktop-release:
    name: Desktop Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - name: Build ${{ matrix.platform }}
        run: flutter build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: build/${{ matrix.platform }}

  # ---------------------------------------------------------------------------
  # HarmonyOS: DISABLED by default. Requires a self-hosted runner with the
  # Flutter-OH SDK + DevEco/AGC credentials. Enable and configure secrets when
  # your environment is ready (see docs/CI-CD.md).
  # ---------------------------------------------------------------------------
  ohos-release:
    name: HarmonyOS Release (manual)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Flutter-OH build (placeholder)
        run: |
          echo "Install the Flutter-OH SDK, then run:"
          echo "  flutter create --platforms=ohos ."
          echo "  flutter build hap --release"
          echo "Upload the .hap/.app via AppGallery Connect API (agconnect CLI)."
