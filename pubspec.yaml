name: app_template
description: >-
  A reusable, cross-platform Flutter application template. One Dart codebase
  targets iOS, Android, HarmonyOS (Flutter-OH), Windows, macOS, Linux and Web.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Cubit / Bloc)
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Dependency injection
  get_it: ^7.7.0

  # Networking
  dio: ^5.4.0

  # Key/value storage backend
  shared_preferences: ^2.3.0

  # OpenHarmony (Flutter-OH) platform adapter for shared_preferences.
  # The pub.dev `shared_preferences` package ships no ohos endorsement, so on
  # Flutter-OH `SharedPreferences.getInstance()` throws MissingPluginException
  # during bootstrap -> runApp never runs -> blank white screen on the OH
  # emulator. The OpenHarmony SIG maintains official ohos implementations of the
  # federated plugins; pulling it in as a *real* dependency (not just an
  # override) makes it reachable in the transitive closure so Flutter-OH's
  # plugin scanner registers its method-call handler. It declares an `ohos`
  # plugin platform only, so it is a harmless no-op on the six official
  # platforms (iOS/Android/macOS/Linux/Windows/Web builds ignore it).
  shared_preferences_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/shared_preferences/shared_preferences_ohos

  # Logging
  logger: ^2.4.0

  # Localization helpers (used by flutter gen-l10n).
  # Pinned to ^0.20.2 to satisfy BOTH toolchains:
  #  - standard Flutter 3.47 SDK's flutter_localizations needs intl >= 0.20.3 (resolves 0.20.3);
  #  - Flutter-OH (OpenHarmony, ~3.35) SDK pins flutter_localizations to intl 0.20.2 (resolves 0.20.2).
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # End-to-end / integration testing SDK
  integration_test:
    sdk: flutter

  # Lint rules
  flutter_lints: ^4.0.0

  # Test doubles (no code generation)
  mocktail: ^1.0.0

  # Cubit / Bloc test helpers
  bloc_test: ^9.1.0

  # System-level UI automation (permissions, deep links, share sheet)
  patrol: ^3.0.0

flutter:
  # Bundles the Material Design icon font so `Icons.*` renders on device.
  uses-material-design: true

  # Generates l10n code (flutter_gen) automatically on `flutter pub get` / `flutter run`.
  generate: true
